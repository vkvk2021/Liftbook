<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liftbook</title>
<meta name="description" content="Gym workout tracker: log sets, track PRs and progress. Your data stays on your device.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a1f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liftbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts are bundled with the app (SIL Open Font License), so no third-party server is contacted. */
@font-face{font-family:"Public Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/public-sans.woff2) format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/saira-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/saira-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/saira-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Saira Condensed";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/saira-condensed-800.woff2) format("woff2")}
/* Layout: app shell. Sticky header, one 1040px column, tab bar at the bottom on phones and in the header on wide screens.
   Competition plate colours encode training goals: red = strength, blue = hypertrophy, green = endurance, yellow = power. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f3f4f7; --ink:#14161b; --muted:#5a606c; --line:#d6dae1;
  --accent:#c8202b; --accent-ink:#ffffff; --accent-soft:rgba(200,32,43,.10);
  --plate-red:#c8202b; --plate-blue:#1d4fbf; --plate-yellow:#d19c00; --plate-green:#1b8747; --plate-white:#f4f5f7; --plate-chrome:#9aa1ab;
  --blue-soft:rgba(29,79,191,.32);
  --good:#1b8747; --good-soft:rgba(27,135,71,.13); --warn:#a96a00; --warn-soft:rgba(209,156,0,.16); --bad:#c8202b;
  --scrim:rgba(10,12,16,.5);
  --shadow:0 1px 2px rgba(20,24,30,.06),0 6px 20px rgba(20,24,30,.06);
  --font-display:"Saira Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1013; --surface:#171a1f; --surface-2:#1f232a; --ink:#eceef2; --muted:#9aa1ad; --line:#2c3139;
  --accent:#ff4b54; --accent-ink:#1a0709; --accent-soft:rgba(255,75,84,.14);
  --plate-red:#ff4b54; --plate-blue:#6f9cff; --plate-yellow:#f0c02c; --plate-green:#3fc178; --plate-white:#dfe2e7; --plate-chrome:#7b828c;
  --blue-soft:rgba(111,156,255,.32);
  --good:#3fc178; --good-soft:rgba(63,193,120,.15); --warn:#f0b43c; --warn-soft:rgba(240,192,44,.15); --bad:#ff4b54;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --surface-2:#1f232a; --ink:#eceef2; --muted:#9aa1ad; --line:#2c3139;
  --accent:#ff4b54; --accent-ink:#1a0709; --accent-soft:rgba(255,75,84,.14);
  --plate-red:#ff4b54; --plate-blue:#6f9cff; --plate-yellow:#f0c02c; --plate-green:#3fc178; --plate-white:#dfe2e7; --plate-chrome:#7b828c;
  --blue-soft:rgba(111,156,255,.32);
  --good:#3fc178; --good-soft:rgba(63,193,120,.15); --warn:#f0b43c; --warn-soft:rgba(240,192,44,.15); --bad:#ff4b54;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,a,label,select{touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plate-blue);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(30px,5.4vw,42px)}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
a{color:var(--plate-blue)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num-t{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:800 22px/1 var(--font-display);letter-spacing:.06em}
.brand i{width:20px;height:20px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 6px var(--accent),inset 0 0 0 7px var(--surface);display:block}
.toptabs{display:none;gap:2px;margin-left:12px}
.toptabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.toptabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="saved"]::before,.sync[data-s="local"]::before{background:var(--good)}
.sync[data-s="saving"]::before{background:var(--plate-yellow)}
.sync[data-s="error"]::before,.sync[data-s="memory"]::before{background:var(--bad)}
.sync[data-s="demo"]::before{background:var(--plate-blue)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.ic{width:22px;height:22px}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent)}
@media (min-width:860px){.tabs{display:none}.toptabs{display:flex}}

main{max-width:1040px;margin:0 auto;padding-block:20px 150px}
@media (min-width:860px){main{padding-block:28px 110px}}

/* Generic */
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card > h2,.card > h3{margin-bottom:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:inherit;text-align:left;font:inherit}
.link:hover{color:var(--plate-blue)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
button.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.g-strength{color:var(--plate-red);border-color:currentColor;background:transparent}
.g-hypertrophy{color:var(--plate-blue);border-color:currentColor;background:transparent}
.g-endurance{color:var(--plate-green);border-color:currentColor;background:transparent}
.g-power{color:var(--plate-yellow);border-color:currentColor;background:transparent}
.g-general{color:var(--muted);border-color:currentColor;background:transparent}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.bg-strength{background:var(--plate-red)}.bg-hypertrophy{background:var(--plate-blue)}.bg-endurance{background:var(--plate-green)}.bg-power{background:var(--plate-yellow)}.bg-general{background:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:16px;font-weight:500}
textarea.inp{min-height:64px;resize:vertical}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{display:block;font-size:13px;color:var(--muted)}
button.li{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
button.li:first-child{border-top:0}
button.li:hover .t{color:var(--plate-blue)}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--muted);background:none;border:0;padding:0}
.back:hover{color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}

/* Stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{background:var(--surface);padding:14px 16px;min-width:0}
.tile b{display:block;font:700 30px/1.05 var(--font-display);font-variant-numeric:tabular-nums;margin-top:4px}
.tile b small{font-size:18px;color:var(--muted);font-weight:600}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* Today hero */
.hero{display:grid;gap:14px;padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:26px solid var(--hero-plate,var(--line));opacity:.18;pointer-events:none}
.hero.g-bg-strength{--hero-plate:var(--plate-red)}.hero.g-bg-hypertrophy{--hero-plate:var(--plate-blue)}.hero.g-bg-endurance{--hero-plate:var(--plate-green)}.hero.g-bg-power{--hero-plate:var(--plate-yellow)}
.plan-list{display:grid;gap:0;border-top:1px solid var(--line)}
.plan-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.plan-row .n{font-weight:600}
.plan-row .tgt{color:var(--muted);font-variant-numeric:tabular-nums}
.plan-row .sg{grid-column:1/-1;font-size:12.5px}
.sug{font-size:12.5px;color:var(--muted)}
.sug b{font-weight:700;margin-right:5px;white-space:nowrap}
.sug-up b{color:var(--good)}
.sug-hold b{color:var(--plate-blue)}
.sug-new b{color:var(--muted)}
.sug-deload b{color:var(--warn)}
.callout{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;border:1px dashed var(--line);background:var(--surface)}
.demo-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:16px;border-radius:10px;background:var(--blue-soft);font-size:14px}

/* Volume bars */
.vbars{display:grid;gap:7px}
.vb{display:grid;grid-template-columns:minmax(6.5rem,8rem) 1fr 4.6rem;gap:10px;align-items:center;font-size:13px}
.vb-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb-track{position:relative;height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.vb-band{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:1px dashed var(--good);border-right:1px dashed var(--good)}
.vb-d{position:absolute;left:0;top:3px;bottom:3px;background:var(--plate-blue);border-radius:2px}
.vb-i{position:absolute;top:3px;bottom:3px;background:var(--blue-soft);border-radius:0 2px 2px 0}
.vb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.vb-v.low{color:var(--warn)}.vb-v.ok{color:var(--good)}.vb-v.high{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Logger */
.live-head{display:grid;gap:10px;margin-bottom:16px}
.title-input{width:100%;border:0;border-bottom:2px solid transparent;background:transparent;font:700 clamp(28px,5vw,40px)/1.1 var(--font-display);padding:2px 0;color:var(--ink)}
.title-input:hover,.title-input:focus{border-bottom-color:var(--line);outline:none}
.live-stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted)}
.live-stats b{font:700 22px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}
.exc{padding:14px}
.exc-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.exc-t{min-width:0}
.exc-t .h3{font:700 20px/1.1 var(--font-display)}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.exc-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.e1{text-align:right;font-size:11px;color:var(--muted);line-height:1.1}
.e1 b{display:block;font:700 20px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.pr-badge{font:800 12px/1 var(--font-display);letter-spacing:.06em;padding:4px 6px;border-radius:5px;background:var(--plate-yellow);color:#1a1400}
.exc-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 8px}
.setgrid,.setrow{display:grid;grid-template-columns:2.3rem minmax(3.2rem,1fr) minmax(3.4rem,1.15fr) minmax(3rem,1fr) minmax(2.5rem,.7fr) 2.75rem;gap:6px;align-items:center}
.setgrid.head{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 0}
.setgrid.head span{text-align:center}
.setrow{padding:3px 0}
.setno{height:38px;border-radius:8px;border:0;background:var(--surface-2);font:700 16px/1 var(--font-display);color:var(--ink)}
.setno.t-W{color:var(--plate-yellow)}.setno.t-D{color:var(--plate-blue)}.setno.t-F{color:var(--plate-red)}
.prev{font-size:12.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:100%;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink);padding:0 2px}
.num::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.tick{height:38px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center}
.tick:hover{border-color:var(--good);color:var(--good)}
.setrow.done .num{background:var(--good-soft);border-color:transparent}
.setrow.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.exc-f{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exc .inp{margin-top:8px}
.add-ex{margin-top:16px;border-style:dashed;min-height:48px}

/* Dock: rest timer and resume bar */
#dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:19;pointer-events:none}
@media (min-width:860px){#dock{bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
.dock-in{max-width:1040px;margin:0 auto;display:grid;gap:8px;padding-block:8px}
.dock-in > *{pointer-events:auto}
.rest{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow)}
.rest-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(127,127,127,.22);transition:width .5s linear;pointer-events:none}
.rest > *{position:relative}
.rest b{font:700 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.rest .rest-for{font-size:12.5px;opacity:.75;flex:1;min-width:6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.5)}
.rest.over{background:var(--good);color:#fff}
@media (max-width:520px){.rest .rest-for,.rest .rest-lbl{display:none}.rest{gap:8px;flex-wrap:nowrap}.rest b{margin-right:auto}.rest .btn{padding:0 8px}}
.resume{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-weight:600;text-align:left}
.resume span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume b{font:700 18px/1 var(--font-display);font-variant-numeric:tabular-nums}
.resume-go{color:var(--accent)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}.rest-fill{transition:none}}

/* Charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent-soft);stroke:none}
.ch-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.ch-end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch-lbl{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.ch-endlbl{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--font-body)}
.empty-chart{display:grid;place-items:center;height:140px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px;text-align:center;padding:12px}

/* Week columns */
.wkbars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end}
.wkb{display:grid;gap:6px;justify-items:center;min-width:0}
.wkb-col{position:relative;width:100%;max-width:44px;height:130px;display:flex;flex-direction:column-reverse;gap:2px}
.wkb-col i{display:block;width:100%;border-radius:3px}
.wkb-plan{position:absolute;left:-3px;right:-3px;border-top:2px dashed var(--ink);opacity:.5}
.wkb span{font-size:11px;color:var(--muted);white-space:nowrap}
.heat td{text-align:center;font-weight:600;min-width:44px}
.heat td.h0{color:var(--muted);font-weight:400}
.heat td.hl{background:var(--warn-soft)}
.heat td.hk{background:var(--good-soft)}
.heat td.hh{background:var(--accent-soft)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px}
.cal button,.cal span.c{aspect-ratio:1/1;max-width:100%;border-radius:8px;border:1px solid transparent;background:var(--surface-2);font-size:13px;font-weight:600;display:grid;place-items:center;align-content:center;gap:2px;color:var(--ink);padding:0}
.cal span.c{background:transparent;color:var(--muted);font-weight:500}
.cal .today{border-color:var(--ink)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.cal .out{visibility:hidden}

/* Plates */
.barviz{display:flex;align-items:center;justify-content:center;height:130px;margin:10px 0;overflow-x:auto}
.barviz .sleeve{height:12px;width:40px;background:var(--plate-chrome);border-radius:2px;flex-shrink:0}
.barviz .collar{height:30px;width:10px;background:var(--plate-chrome);border-radius:2px;flex-shrink:0;margin-right:2px}
.barviz .plate{width:16px;border-radius:3px;margin-right:2px;flex-shrink:0;border:1px solid rgba(0,0,0,.25)}
.pl-red{background:var(--plate-red)}.pl-blue{background:var(--plate-blue)}.pl-yellow{background:var(--plate-yellow)}.pl-green{background:var(--plate-green)}.pl-white{background:var(--plate-white)}.pl-chrome{background:var(--plate-chrome)}

/* Modal + toast */
.modal-back{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
@media (min-width:700px){.modal-back{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.picker-list{max-height:52vh;overflow:auto;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.bar-prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar-prog i{display:block;height:100%;background:var(--good);border-radius:4px}
.pr-ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--warn-soft);color:var(--warn);flex-shrink:0;font:800 12px/1 var(--font-display)}
.sched{display:grid;gap:0}
.sched-row{display:grid;grid-template-columns:6.5rem 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sched-row:first-child{border-top:0}
.sched-row .d{font-weight:700;font-family:var(--font-display);font-size:18px}
.sched-row.today .d{color:var(--accent)}
.rt-ex{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rt-ex:first-child{border-top:0}
.rt-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rt-fields .inp{min-height:36px;padding:4px 8px}
@media (max-width:420px){.vb{grid-template-columns:5.6rem 1fr 4rem}.sched-row{grid-template-columns:5rem 1fr}}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
</style>
</head>

const EXI = id => EXMAP[id] || {id,name:'Removed exercise',eq:'machine',type:'i',pri:[],sec:[],cue:''};

/* ================= Storage ================= */
const LSKEY = 'liftbook:v1';
// Everything lives in this browser's localStorage on the user's own device. Nothing is sent anywhere.
const Store = {
  mode:'loading', lsTimer:null, dirty:false,
  init(){
    this.mode='local'; this.loadLocal(); S.ready=true; setSync(); onData();
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{ S.persisted=!!p; }).catch(()=>{}); }catch(e){}
    // Another open tab of Liftbook saved: pick up its changes.
    window.addEventListener('storage',ev=>{ if(ev.key===LSKEY && !this.dirty){ this.loadLocal(); if(S.d!==S.real) return; onData(); } });
    // Phones can kill a backgrounded app at any time, so write pending changes as soon as it is hidden.
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') this.flushLocal(); });
    window.addEventListener('pagehide',()=>this.flushLocal());
  },
  put(){ if(S.d!==S.real) return; this.saveLocal(); },
  putSoon(){ if(S.d!==S.real) return; this.saveLocal(); },
  async bulk(){ this.flushLocal(); },
  saveLocal(){ this.dirty=true; clearTimeout(this.lsTimer); this.lsTimer=setTimeout(()=>this.flushLocal(),250); },
  flushLocal(){
    clearTimeout(this.lsTimer); if(!this.dirty) return; this.dirty=false;
    try{ localStorage.setItem(LSKEY,JSON.stringify(S.real)); if(this.mode==='memory'){ this.mode='local'; setSync(); } }
    catch(e){ this.mode='memory'; setSync(); toast(e && e.name==='QuotaExceededError' ? 'Device storage for Liftbook is full. Export a backup, then delete old workouts.' : 'This browser is blocking storage, so changes are not being saved.'); }
  },
  loadLocal(){
    try{ const raw=localStorage.getItem(LSKEY); if(raw){ const o=JSON.parse(raw); S.real.profile=normalizeProfile(o.profile); S.real.workouts=o.workouts||{}; S.real.active=o.active||null; } }
    catch(e){ this.mode='memory'; }
  },
};
function writeError(){ toast('Could not save on this device.'); }
function setSync(s){
  if(s) S.sync=s; else S.sync = Store.mode==='memory' ? 'memory' : Store.mode==='local' ? 'local' : S.sync;
  const el=$('#sync'); if(!el) return;
  const st = S.d!==S.real ? 'demo' : S.sync;
  const txt = {loading:'Loading…',local:'Saved on this device',memory:'Not saved',demo:'Example data'}[st]||'';
  el.dataset.s=st; el.textContent=txt;
}

/* ================= History index & analytics ================= */
let IDX=null;
function idx(){
  if(IDX) return IDX;
  const list=Object.entries(S.d.workouts).map(([id,w])=>{ if(w && w.id!==id) w.id=id; return w; }).filter(w=>w&&w.startedAt).sort((a,b)=>a.startedAt-b.startedAt);
  const byEx={};
  for(const w of list) for(const e of (w.exercises||[])){
    const sets=(e.sets||[]).filter(s=>s.done!==false); if(!sets.length) continue;
    (byEx[e.exId]||(byEx[e.exId]=[])).push({wid:w.id,ts:w.startedAt,goal:e.goal||w.goal,sets,notes:e.notes});
  }
  return IDX={list,byEx};
}
const hist = exId => idx().byEx[exId]||[];
const working = sets => sets.filter(s=>s.type!=='W' && s.done!==false);
function lastSession(exId,before=Infinity){ const h=hist(exId); for(let i=h.length-1;i>=0;i--) if(h[i].ts<before && working(h[i].sets).length) return h[i]; return null; }
function stats(exId,before=Infinity){
  const st={sessions:0,maxW:0,maxWSet:null,maxE1:0,e1Set:null,maxR:0,maxRSet:null,sets:[],last:null};
  for(const h of hist(exId)){
    if(h.ts>=before) continue; const ws=working(h.sets); if(!ws.length) continue;
    st.sessions++; st.last=h;
    for(const s of ws){
      const w=s.w||0, r=s.r||0; st.sets.push({w,r,ts:h.ts});
      if(w>st.maxW || (w===st.maxW && st.maxWSet && r>st.maxWSet.r) || !st.maxWSet){ if(w>=st.maxW){ st.maxW=w; st.maxWSet={w,r,ts:h.ts}; } }
      const e=e1rm(w,r); if(e>st.maxE1){ st.maxE1=e; st.e1Set={w,r,ts:h.ts}; }
      if(r>st.maxR){ st.maxR=r; st.maxRSet={w,r,ts:h.ts}; }
    }
  }
  st.repsAt = w => { let m=0; for(const s of st.sets) if(s.w>=w-1e-6 && s.r>m) m=s.r; return m; };
  return st;
}
function detectPRs(w){
  const prs=[];
  for(const e of (w.exercises||[])){
    const ex=EXI(e.exId), before=stats(e.exId,w.startedAt);
    if(!before.sessions) continue;
    let bW=null,bE=null,bR=null;
    for(const s of working(e.sets)){
      const wt=s.w||0, r=s.r||0; if(!r) continue;
      if(wt>0 && wt>before.maxW+1e-6 && (!bW || wt>bW.w || (wt===bW.w && r>bW.r))) bW={w:wt,r};
      const v=ex.timed?0:e1rm(wt,r);
      if(v>before.maxE1+0.05 && (!bE || v>bE.v)) bE={v,w:wt,r};
      const prevR=before.repsAt(wt);
      if(prevR>0 && r>prevR && (!bR || r-prevR>bR.d)) bR={w:wt,r,d:r-prevR};
    }
    if(bW) prs.push({exId:e.exId,type:'weight',w:bW.w,r:bW.r});
    if(bE && !(bW && bW.w===bE.w && bW.r===bE.r)) prs.push({exId:e.exId,type:'e1rm',v:bE.v,w:bE.w,r:bE.r});
    if(bR && !(bW && bW.w===bR.w && bW.r===bR.r)) prs.push({exId:e.exId,type:'reps',w:bR.w,r:bR.r});
  }
  return prs;
}
function setStr(s,ex){
  if(!s) return '—';
  if(ex && ex.timed) return (s.w? '+'+wDisp(s.w)+' × ':'')+s.r+'s';
  if(ex && ex.eq==='bodyweight' && !s.w) return s.r+' reps';
  return (ex && ex.eq==='bodyweight' ? '+' : '')+wDisp(s.w)+' × '+s.r;
}
function prText(p){
  const ex=EXI(p.exId);
  if(p.type==='weight') return `Heaviest ${ex.name}: ${fmtW(p.w)} × ${p.r}`;
  if(p.type==='e1rm') return `Best estimated 1RM on ${ex.name}: ${num(toDisp(p.v),0)} ${unit()}`;
  return `Rep record on ${ex.name}: ${setStr(p,ex)}`;
}
function muscleSets(from,to,list){
  const m={}; for(const k in MUSCLES) m[k]={d:0,i:0};
  for(const w of (list||idx().list)){
    if(w.startedAt<from || w.startedAt>=to) continue;
    for(const e of w.exercises||[]){ const n=working(e.sets||[]).length; if(!n) continue; const ex=EXI(e.exId);
      ex.pri.forEach(k=>m[k]&&(m[k].d+=n)); ex.sec.forEach(k=>m[k]&&(m[k].i+=n)); }
  }
  return m;
}
const eff = v => v.d + v.i*0.5;
function weekTotals(list){
  let sets=0,vol=0,time=0;
  for(const w of list){ time+=Math.max(0,(w.endedAt||w.startedAt)-w.startedAt);
    for(const e of w.exercises||[]) for(const s of working(e.sets||[])){ sets++; vol+=(s.w||0)*(s.r||0); } }
  return {sets,vol,time};
}
const countSets = w => (w.exercises||[]).reduce((n,e)=>n+working(e.sets||[]).length,0);
function blockInfo(date=new Date()){
  const pg=P().program; const start=startOfWeek(new Date((pg.blockStart||isoDate())+'T00:00'));
  const wk=Math.round((startOfWeek(date)-start)/(7*864e5)); const len=Math.max(2,pg.blockWeeks||6);
  const n=((wk%len)+len)%len+1; return {week:n,len,deload:!!pg.deload && n===len};
}
const plannedFor = d => routineById(P().program.days[dayKey(d)]);

/* ================= Progressive overload ================= */
function incFor(ex){
  const kg={barbell:2.5,smith:2.5,dumbbell:2,cable:2.5,machine:2.5,kettlebell:4,band:0,bodyweight:2.5};
  const lb={barbell:5,smith:5,dumbbell:5,cable:5,machine:5,kettlebell:9,band:0,bodyweight:5};
  return (unit()==='lb'?lb:kg)[ex.eq] ?? 2.5;
}
function bumpKg(kg,ex){ const inc=incFor(ex); const step=unit()==='lb'?2.5:(ex.eq==='dumbbell'?1:1.25); const d=Math.round((toDisp(kg)+inc)/step)*step; return fromDisp(d); }
function suggest(exId,repMin,repMax,deload){
  const ex=EXI(exId), last=lastSession(exId);
  const lo=repMin||8, hi=repMax||lo;
  if(!last) return {dir:'new',w:null,reps:null,note:`First time: choose a weight you can lift for ${lo}–${hi} reps with 1–3 reps left in the tank.`};
  const ws=working(last.sets); const top=Math.max(...ws.map(s=>s.w||0)); const at=ws.filter(s=>(s.w||0)===top); const minR=Math.min(...at.map(s=>s.r||0));
  if(deload) return {dir:'deload',w:top,reps:lo,note:`Deload: keep ${top?fmtW(top):'bodyweight'}, do fewer sets, stop 3+ reps short of failure.`};
  if(ex.timed) return {dir:'hold',w:top||null,reps:minR+5,note:`Hold for ${minR+5}s, five seconds longer than last time.`};
  if(ex.eq==='bodyweight' && !top){
    if(minR>=hi) return {dir:'up',w:null,reps:hi,note:`You hit ${hi}+ reps on every set. Add weight or slow the tempo.`};
    return {dir:'hold',w:null,reps:Math.min(hi,minR+1),note:`Aim for ${Math.min(hi,minR+1)} reps on every set.`};
  }
  if(ex.eq==='band') return {dir:'hold',w:top,reps:Math.min(hi,minR+1),note:`Aim for ${Math.min(hi,minR+1)} reps or use a stronger band.`};
  if(minR>=hi){ const nw=bumpKg(top,ex); return {dir:'up',w:nw,reps:lo,note:`Every set reached ${hi} reps. Go up to ${fmtW(nw)} and build back from ${lo}.`}; }
  if(minR<lo) return {dir:'hold',w:top,reps:lo,note:`Stay at ${fmtW(top)} until every set reaches ${lo} reps.`};
  const t=Math.min(hi,minR+1);
  return {dir:'hold',w:top,reps:t,note:`Same weight, ${fmtW(top)}. Aim for ${t} reps per set.`};
}
function sugHTML(s){
  if(!s) return '';
  const mark={up:'↑',hold:'=',new:'•',deload:'↓'}[s.dir]||'';
  const lead={up:'Go heavier',hold:'Add reps',new:'New',deload:'Deload'}[s.dir];
  return `<span class="sug sug-${s.dir}"><b>${mark} ${lead}</b><span>${esc(s.note)}</span></span>`;
}

function keepFocus(fn){

  try{ if(id && typeof a.selectionStart==='number') sel=[a.selectionStart,a.selectionEnd]; }catch(e){}
  fn();

}

function calendarHTML(base,list){
  const y=base.getFullYear(), mo=base.getMonth(); const first=new Date(y,mo,1), days=new Date(y,mo+1,0).getDate(); const lead=(first.getDay()+6)%7;

  let h=['M','T','W','T','F','S','S'].map(d=>`<span class="dn">${d}</span>`).join('');
  for(let i=0;i<lead;i++) h+='<span class="c out"></span>';
  const today=isoDate();
  for(let d=1;d<=days;d++){
    const k=isoDate(new Date(y,mo,d)), ws=byDay[k]||[];
    const dots=`<span class="dots">${ws.slice(0,3).map(w=>`<i class="bg-${w.goal||'general'}"></i>`).join('')}</span>`;
    h+= ws.length ? `<button class="${k===today?'today':''}" data-act="nav" data-v="workout:${ws[0].id}" aria-label="${esc(ws[0].name)} on ${k}">${d}${dots}</button>` : `<span class="c ${k===today?'today':''}">${d}</span>`;
  }
  return `<div class="cal">${h}</div>`;
}

function hints(e,si){
  const a=S.d.active, s=e.sets[si];
  const last=lastSession(e.exId,a.startedAt); const prev=last?last.sets:[];
  const isW=s.type==='W';
  const pool=prev.filter(x=>(x.type==='W')===isW);
  const pos=e.sets.slice(0,si).filter(x=>(x.type==='W')===isW).length;
  const p=pool[pos]||null;
  let w=null,r=null;
  if(isW){ if(p){ w=p.w; r=p.r; } }
  else { const sg=e.sug; w = sg&&sg.w!=null ? sg.w : (p?p.w:null); r = sg&&sg.reps!=null ? sg.reps : (p?p.r:(e.repMin||null)); }
  const before=e.sets.slice(0,si).reverse().find(x=>x.type===s.type && x.w!=null);
  if(before){ w=before.w; if(before.r!=null && !isW) r=r ?? before.r; }
  return {w,r,p};
}

const blankSet = (type='N') => ({w:null,r:null,rir:null,type,done:false});
function newEntry(exId,goal,nSets,repMin,repMax,rest,deload){

  const e={exId,goal:GOALS[goal]?goal:'general',repMin,repMax,rest:rest||restFor(goal),notes:'',sets:[]};

      ${!e.timed&&reps.length?`<section class="card"><h3>Rep records</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Reps</th><th class="r">Best weight</th><th class="r">Date</th></tr></thead><tbody>${reps.map(x=>`<tr><td>${x.n}+</td><td class="r">${fmtW(x.s.w)} × ${x.s.r}</td><td class="r">${fmtShort(x.s.ts)}</td></tr>`).join('')}</tbody></table></div></section>`:''}
      <section class="card"><h3>History</h3><div class="list">${h.slice().reverse().slice(0,12).map(x=>`<button class="li" data-act="nav" data-v="workout:${x.wid}"><span class="grow"><span class="t">${fmtDay(x.ts)}</span><span class="s num-t">${x.sets.map(s=>(s.type==='W'?'W ':'')+setStr(s,e)).join(' · ')}</span></span></button>`).join('')}</div></section>
    </div>`:`<p class="note">No sets logged for this exercise yet. Records, charts and history appear after your first session.</p>`}
    <section class="card"><h3>Alternatives for ${esc(musclesTxt(e.pri.slice(0,1)))}</h3><div class="list">${alts.map(x=>`<button class="li" data-act="nav" data-v="exercise:${x.id}"><span class="grow"><span class="t">${esc(x.name)}</span><span class="s">${EQUIP[x.eq]} · ${x.type==='c'?'Compound':'Isolation'}</span></span></button>`).join('')||'<p class="empty">No alternatives in the library.</p>'}</div></section>
  </div>`;
}
function sessionPts(exId,metric){
  const ex=EXI(exId); const pts=[];
  for(const h of hist(exId)){ const ws=working(h.sets); if(!ws.length) continue; let y;
    if(metric==='e1rm') y=toDisp(Math.max(...ws.map(s=>e1rm(s.w||0,s.r||0))));
    else if(metric==='top') y=toDisp(Math.max(...ws.map(s=>s.w||0)));
    else if(metric==='vol') y=toDisp(ws.reduce((a,s)=>a+(s.w||0)*(s.r||0),0));
    else y=Math.max(...ws.map(s=>s.r||0));
    pts.push({x:h.ts,y}); }
  const u=metric==='reps'?(ex.timed?'s':' reps'):' '+unit();
  return {pts,metric,fmt:v=>Math.round(v).toLocaleString()+u};
}

/* ---------- Charts ---------- */
function chartW(){ const m=$('#main'); const cs=m?getComputedStyle(m):null; const inner=m?m.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight):640; return Math.max(260,Math.min(980,inner-34)); }
function niceRange(min,max){ if(min===max){ min-=1; max+=1; } const raw=(max-min)/4, mag=10**Math.floor(Math.log10(raw)), n=raw/mag; const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag; return [Math.floor(min/step)*step,Math.ceil(max/step)*step,step]; }
function lineChart(pts,o={}){
  if(pts.length<2) return `<div class="empty-chart">${pts.length?'One session so far. The line appears after the second.':'Nothing logged yet.'}</div>`;
  const W=chartW(), H=o.h||Math.min(240,Math.max(170,W*0.36)), L=48, R=20, T=22, B=26, fmt=o.fmt||(v=>String(Math.round(v)));
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y); const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const [y0,y1,step]=niceRange(Math.min(...ys),Math.max(...ys));
  const X=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R), Y=y=>T+(1-(y-y0)/((y1-y0)||1))*(H-T-B);
  let g=''; for(let v=y0; v<=y1+step/2; v+=step){ const y=Y(v); g+=`<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ch-lbl" x="${L-8}" y="${y+4}" text-anchor="end">${Math.round(v*10)/10}</text>`; }
  const tickN=W<420?3:5, xt=[]; for(let i=0;i<tickN;i++) xt.push(x0+(x1-x0)*i/(tickN-1));
  g+=xt.map((x,i)=>`<text class="ch-lbl" x="${X(x)}" y="${H-6}" text-anchor="${i===0?'start':i===tickN-1?'end':'middle'}">${fmtShort(x)}</text>`).join('');
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=d+` L${X(pts[pts.length-1].x).toFixed(1)} ${Y(y0)} L${X(pts[0].x).toFixed(1)} ${Y(y0)} Z`;
  const last=pts[pts.length-1];
  const dots=pts.length<=40?pts.slice(0,-1).map(p=>`<circle class="ch-dot" cx="${X(p.x)}" cy="${Y(p.y)}" r="3"/>`).join(''):'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${pts.length} sessions, latest ${esc(fmt(last.y))}">${g}<path class="ch-area" d="${area}"/><path class="ch-line" d="${d}"/>${dots}
    <circle class="ch-end" cx="${X(last.x)}" cy="${Y(last.y)}" r="5"/><text class="ch-endlbl" x="${Math.min(X(last.x),W-R)}" y="${Math.max(13,Y(last.y)-11)}" text-anchor="end">${esc(fmt(last.y))}</text></svg>`;
}

function vProgress(){
  const t=S.sub.prog;

function pStrength(){
  const logged=Object.keys(idx().byEx).filter(id=>hist(id).some(h=>working(h.sets).length)).sort((a,b)=>hist(b).length-hist(a).length);

function pConsistency(){
  const planned=DAYS.filter(d=>routineById(P().program.days[d])).length;

  const byGoal={}; for(const w of recent) for(const e of w.exercises){ const g=e.goal||w.goal||'general'; const b=byGoal[g]||(byGoal[g]={sets:0,reps:0,rir:0,rirN:0,vol:0}); for(const s of working(e.sets)){ b.sets++; b.reps+=s.r||0; b.vol+=(s.w||0)*(s.r||0); if(s.rir!=null){ b.rir+=s.rir; b.rirN++; } } }

    <div class="tile"><span>Current streak</span><b>${plural(streak,'week')}</b></div><div class="tile"><span>Average session</span><b>${avgDur?fmtDur(avgDur):'—'}</b></div></div>
  <section class="card"><h3>Planned vs completed</h3>
    <div class="wkbars">${weeks.map((w,i)=>`<div class="wkb"><div class="wkb-col">${w.list.map(x=>`<i class="bg-${x.goal||'general'}" style="height:calc(${100/maxN}% - 2px)" title="${esc(x.name)}"></i>`).join('')}<span class="wkb-plan" style="bottom:${planned/maxN*100}%"></span></div><span>${i===7?'Now':fmtShort(w.s)}</span></div>`).join('')}</div>
    <div class="legend">${GOAL_ORDER.slice(0,4).map(g=>`<span><i class="bg-${g}"></i>${GOALS[g].n}</span>`).join('')}<span><i style="border-top:2px dashed var(--ink);height:0;width:14px"></i>Planned</span></div></section>

    ${GOAL_ORDER.filter(g=>byGoal[g]).map(g=>{ const b=byGoal[g]; return `<tr><td><span class="chip g-${g}">${GOALS[g].n}</span></td><td class="r">${b.sets}</td><td class="r">${num(b.reps/b.sets,1)}</td><td class="r">${b.rirN?num(b.rir/b.rirN,1):'—'}</td><td class="r">${fmtVol(b.vol)}</td></tr>`; }).join('')}</tbody></table></div>`:'<p class="empty">No sets in the last four weeks.</p>'}</section>
  <section class="card"><h3>Training days</h3><div class="wkbars" style="grid-template-columns:repeat(7,1fr)">${DAYS.map((d,i)=>{ const mx=Math.max(1,...dayCounts); return `<div class="wkb"><div class="wkb-col" style="height:90px"><i class="bg-general" style="height:${dayCounts[i]/mx*100}%;opacity:.6"></i></div><span>${DAY_N[d].slice(0,3)} · ${dayCounts[i]}</span></div>`; }).join('')}</div></section>`;
}
const BODY_F = [['weight','Body weight','w'],['bodyFat','Body fat','%'],['waist','Waist','l'],['chest','Chest','l'],['arm','Arm','l'],['thigh','Thigh','l']];
function bodyVal(k,v){ const f=BODY_F.find(x=>x[0]===k); if(v==null) return ''; return f[2]==='w'?wDisp(v):f[2]==='l'?lenDisp(v):num(v,1); }
const bodyUnit = k => { const f=BODY_F.find(x=>x[0]===k)[2]; return f==='w'?unit():f==='l'?lenUnit():'%'; };
function pBody(){
  const b=P().body.slice().sort((x,y)=>x.d.localeCompare(y.d)); const k=S.sub.bodyMetric;
  const pts=b.filter(e=>e[k]!=null).map(e=>({x:new Date(e.d+'T12:00').getTime(),y:parseFloat(bodyVal(k,e[k]))}));
  return `<section class="card"><h3>Add a measurement</h3><div class="formgrid">
      <label class="field">Date<input id="b-d" class="inp" type="date" value="${isoDate()}"></label>
      ${BODY_F.map(([f,n])=>`<label class="field">${n} (${bodyUnit(f)})<input id="b-${f}" class="inp" inputmode="decimal" autocomplete="off"></label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="bodySave">Save measurement</button><span class="muted small">Fill in only what you measured.</span></div></section>
  <section class="card"><div class="seg" style="margin-bottom:12px">${BODY_F.map(([f,n])=>`<button data-act="bodyMetric" data-k="${f}" aria-pressed="${k===f}">${n}</button>`).join('')}</div>
    <div class="chart">${lineChart(pts,{fmt:v=>num(v,1)+' '+bodyUnit(k)})}</div></section>
  <section class="card"><h3>Entries</h3>${b.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th>${BODY_F.map(([f,n])=>`<th class="r">${n}</th>`).join('')}<th></th></tr></thead><tbody>
    ${b.slice().reverse().map(e=>`<tr><td>${fmtShort(new Date(e.d+'T12:00'))}</td>${BODY_F.map(([f])=>`<td class="r">${e[f]!=null?bodyVal(f,e[f]):'—'}</td>`).join('')}<td class="r"><button class="iconbtn" data-act="bodyDel" data-id="${e.id}" aria-label="Delete entry">${icon('x')}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No measurements yet. Weekly weigh-ins and a monthly tape measure are plenty.</p>'}</section>`;
}

/* ---------- Settings ---------- */

/* ================= Modals ================= */
function renderModalInner(){
  const m=S.modal, el=$('#modal');
  if(!m){ el.innerHTML=''; return; }
  let body='';
  if(m.type==='confirm') body=`<div class="sheet-h"><h2>${esc(m.title)}</h2></div><p>${esc(m.body)}</p><div class="row"><button class="btn ${m.danger?'primary':'primary'}" data-act="${m.act}" ${Object.entries(m.data||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}>${esc(m.ok)}</button><button class="btn ghost" data-act="closeModal">${esc(m.cancel||'Cancel')}</button></div>`;
  else if(m.type==='picker') body=mPicker(m);
  else if(m.type==='exmenu') body=mExMenu(m);
  else if(m.type==='plates') body=mPlates(m);
  else if(m.type==='custom') body=mCustom();
  else if(m.type==='goal') body=mGoal();
  else if(m.type==='text') body=`<div class="sheet-h"><h2>${esc(m.title)}</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${icon('x')}</button></div><p class="muted small">This browser blocked the download. Copy the text and paste it into a file.</p><textarea id="txt-out" class="inp" readonly style="min-height:220px;font-size:12px;font-family:ui-monospace,monospace">${esc(m.text)}</textarea><div class="row"><button class="btn primary" data-act="copyText">Copy</button></div>`;
  el.innerHTML=`<div class="modal-back" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}
function mPicker(m){
  const q=(m.q||'').toLowerCase(), g=m.g||'All', mine=P().settings.equipment;
  let items=allEx().filter(e=>(!q||e.name.toLowerCase().includes(q)||musclesTxt(e.pri).toLowerCase().includes(q))&&(g==='All'||e.pri.some(k=>MUSCLES[k]&&MUSCLES[k].g===g)));
  let similar=[];
  if(m.target.kind==='swap'){ const cur=EXI(S.d.active.exercises[m.target.e].exId); similar=items.filter(e=>e.id!==cur.id && e.pri[0]===cur.pri[0] && mine.includes(e.eq)); items=items.filter(e=>!similar.includes(e)&&e.id!==cur.id); }
  const row=e=>`<button class="li" data-act="pick" data-id="${e.id}"><span class="grow"><span class="t">${esc(e.name)}</span><span class="s">${esc(musclesTxt(e.pri))} · ${EQUIP[e.eq]}${mine.includes(e.eq)?'':' · not at your gym'}</span></span></button>`;
  return `<div class="sheet-h"><h2>${m.target.kind==='swap'?'Swap exercise':'Add exercise'}</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${icon('x')}</button></div>
    <input id="pk-q" class="inp" type="search" data-in="pickq" placeholder="Search exercises" value="${esc(m.q||'')}" autocomplete="off">
    <div class="row">${['All',...GROUPS].map(x=>`<button class="chip" data-act="pickG" data-g="${x}" aria-pressed="${g===x}">${x}</button>`).join('')}</div>
    <div class="picker-list">${similar.length?`<div class="eyebrow" style="padding:10px 0 2px">Same main muscle, your equipment</div>${similar.map(row).join('')}<div class="eyebrow" style="padding:14px 0 2px">Everything else</div>`:''}<div class="list">${items.map(row).join('')||'<p class="empty">No matches.</p>'}</div></div>`;
}
function mExMenu(m){
  const a=S.d.active, e=a.exercises[m.e], ex=EXI(e.exId);
  return `<div class="sheet-h"><h2>${esc(ex.name)}</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${icon('x')}</button></div>
    <div class="formgrid"><label class="field">Rest between sets<select id="em-rest" class="inp" data-ch="exRest" data-e="${m.e}">${[30,45,60,75,90,120,150,180,210,240,300].map(v=>`<option value="${v}" ${e.rest===v?'selected':''}>${clock(v)}</option>`).join('')}</select></label>
      <label class="field">Min reps<input id="em-min" class="inp" inputmode="numeric" data-ch="exReps" data-e="${m.e}" data-f="repMin" value="${e.repMin}"></label>
      <label class="field">Max reps<input id="em-max" class="inp" inputmode="numeric" data-ch="exReps" data-e="${m.e}" data-f="repMax" value="${e.repMax}"></label></div>
    <div class="list">
      <button class="li" data-act="exMove" data-e="${m.e}" data-d="-1" ${m.e===0?'disabled':''}><span class="grow t">Move up</span></button>
      <button class="li" data-act="exMove" data-e="${m.e}" data-d="1" ${m.e===a.exercises.length-1?'disabled':''}><span class="grow t">Move down</span></button>
      <button class="li" data-act="exSwap" data-e="${m.e}"><span class="grow"><span class="t">Swap for a similar exercise</span><span class="s">Machine taken? Keeps the sets, goal and rep range.</span></span></button>
      <button class="li" data-act="exRemove" data-e="${m.e}"><span class="grow t" style="color:var(--bad)">Remove from this workout</span></button></div>`;
}
const PLATES = {kg:[[25,'red'],[20,'blue'],[15,'yellow'],[10,'green'],[5,'white'],[2.5,'red'],[1.25,'chrome']], lb:[[45,'blue'],[35,'yellow'],[25,'green'],[10,'white'],[5,'red'],[2.5,'chrome']]};
function mPlates(m){
  const s=P().settings, u=s.unit, bar=u==='lb'?s.barLb:s.barKg;
  const tgt=m.w!=null?m.w:bar;
  let left=Math.max(0,(tgt-bar)/2); const used=[];
  for(const [p,c] of PLATES[u]){ while(left>=p-1e-9){ used.push([p,c]); left=Math.round((left-p)*1000)/1000; } }
  const maxP=PLATES[u][0][0];
  return `<div class="sheet-h"><h2>Plate calculator</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${icon('x')}</button></div>
    <div class="formgrid"><label class="field">Target weight (${u})<input id="pl-w" class="inp" inputmode="decimal" data-in="plw" value="${num(tgt,2)}"></label><label class="field">Bar (${u})<input class="inp" value="${bar}" disabled></label></div>
    ${tgt<bar?`<p class="note warn">That is lighter than the empty bar.</p>`:`
    <div class="barviz" aria-hidden="true"><span class="sleeve"></span><span class="collar"></span>${used.map(([p,c])=>`<span class="plate pl-${c}" style="height:${30+70*Math.sqrt(p/maxP)}%;width:${p>=10?18:12}px"></span>`).join('')}<span class="sleeve" style="width:24px"></span></div>
    <p><b>Each side:</b> ${used.length?used.map(([p])=>p).join(' + ')+' '+u:'just the bar'}${left>0.001?` <span class="muted">(${num(left*2,2)} ${u} short of the target with standard plates)</span>`:''}</p>`}
    <p class="muted small">Plate colours follow competition standards: red 25, blue 20, yellow 15, green 10, white 5.</p>`;
}
function mCustom(){

    <label class="field">Name<input id="cu-name" class="inp" autocomplete="off" placeholder="e.g. Landmine Press"></label>
    <div class="formgrid"><label class="field">Equipment<select id="cu-eq" class="inp">${Object.entries(EQUIP).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="field">Type<select id="cu-type" class="inp"><option value="c">Compound</option><option value="i">Isolation</option></select></label>

    <div class="field">Helper muscles<div class="checks">${Object.entries(MUSCLES).map(([k,v])=>`<label><input type="checkbox" class="cu-sec" value="${k}"> ${v.n}</label>`).join('')}</div></div>

function mGoal(){

    <label class="field">Exercise<select id="gl-ex" class="inp">${GROUPS.map(g=>`<optgroup label="${g}">${allEx().filter(e=>MUSCLES[e.pri[0]]&&MUSCLES[e.pri[0]].g===g).map(e=>`<option value="${e.id}" ${e.id==='bench'?'selected':''}>${esc(e.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>
    <div class="formgrid"><label class="field">Measure<select id="gl-m" class="inp"><option value="e1rm">Estimated 1RM (${unit()})</option><option value="weight">Heaviest set (${unit()})</option><option value="reps">Reps in one set</option></select></label>
      <label class="field">Target<input id="gl-t" class="inp" inputmode="decimal" placeholder="100"></label></div>

/* ================= Dock: rest timer & resume bar ================= */
function renderDock(){
  const a=S.d.active, r=S.rest; let h='';
  if(r){ const left=Math.max(0,Math.ceil((r.end-Date.now())/1000));
    h+=`<div class="rest ${left===0?'over':''}"><span class="rest-fill" style="width:${r.total?left/r.total*100:0}%"></span><span class="rest-lbl">${left===0?'Rest done':'Rest'}</span><b id="rest-t">${clock(left)}</b><span class="rest-for">${esc(r.label)}</span>
      <button class="btn sm" data-act="restAdj" data-d="-15">−15s</button><button class="btn sm" data-act="restAdj" data-d="15">+15s</button><button class="btn sm" data-act="restSkip">${left===0?'Close':'Skip'}</button></div>`; }
  if(a && !a.editingId && tabOf(S.view)!=='log') h+=`<button class="resume" data-act="nav" data-v="log"><span class="live-dot"></span><span>${esc(a.name)}</span><b data-elapsed="${a.startedAt}">${clock((Date.now()-a.startedAt)/1000)}</b><span class="resume-go">Resume</span></button>`;
  const d=$('#dock'); d.innerHTML=h?`<div class="dock-in">${h}</div>`:''; d.hidden=!h;
}
function startRest(sec,label){ S.rest={end:Date.now()+sec*1000,total:sec,label,fired:false}; renderDock(); }
setInterval(()=>{
  document.querySelectorAll('[data-elapsed]').forEach(el=>{ el.textContent=clock((Date.now()-(+el.dataset.elapsed))/1000); });
  const r=S.rest; if(!r) return;
  const left=Math.max(0,Math.ceil((r.end-Date.now())/1000));
  const t=$('#rest-t'); if(t) t.textContent=clock(left);
  const f=$('.rest-fill'); if(f) f.style.width=(r.total?left/r.total*100:0)+'%';
  if(left===0 && !r.fired){ r.fired=true; beep(); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} renderDock();
    setTimeout(()=>{ if(S.rest===r){ S.rest=null; renderDock(); } },6000); }
},500);

let AC=null;
function unlockAudio(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(){ if(!AC || !P().settings.sound) return; try{ const t=AC.currentTime; [0,0.25].forEach(d=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=880; g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.25,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.2); o.connect(g).connect(AC.destination); o.start(t+d); o.stop(t+d+0.22); }); }catch(e){} }
let WL=null;
async function wakeLock(){ try{ if('wakeLock' in navigator && !WL){ WL=await navigator.wakeLock.request('screen'); WL.addEventListener('release',()=>{ WL=null; }); } }catch(e){ WL=null; } }
function releaseWake(){ try{ WL && WL.release(); }catch(e){} WL=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.d.active && !S.d.active.editingId) wakeLock(); });

/* ================= Actions ================= */
const WRITES = new Set(['start','toggleDone','finish','finishYes','routineNew','routineDup','customSave','goalSave','bodySave','clearAll','exportJson','exportCsv']);
const act = () => S.d.active;
const ACT = {
  nav:d=>nav(d.v),
  backdrop:(d,t,e)=>{ if(e.target===t){ S.modal=null; renderModal(); } },
  closeModal:()=>{ S.modal=null; renderModal(); },
  start:d=>startWorkout(d.routine?{routine:d.routine}:d.from?{from:d.from}:{empty:true}),
  toggleDone:d=>{
    const a=act(), e=a.exercises[+d.e], s=e.sets[+d.s];
    if(!s.done){
      const h=hints(e,+d.s);
      if(s.w==null && h.w!=null) s.w=h.w;
      if(s.r==null && h.r!=null) s.r=h.r;
      if(s.r==null){ toast(`Enter ${EXI(e.exId).timed?'seconds':'reps'} first.`); const el=$(`#s-${d.e}-${d.s}-r`); el&&el.focus(); return; }
      if(s.w==null) s.w=0;
      s.done=true; s.at=Date.now();
      if(!a.editingId) startRest(s.type==='W'?Math.min(60,e.rest):e.rest, 'Next: '+EXI(e.exId).name);
    } else { s.done=false; delete s.at; }
    saveActive(); render();
  },
  setType:d=>{ const s=act().exercises[+d.e].sets[+d.s]; s.type=SET_CYCLE[s.type]||'N'; saveActive(); render(); toast(SET_TYPES[s.type]); },
  addSet:d=>{ const e=act().exercises[+d.e]; const last=e.sets[e.sets.length-1]; e.sets.push(blankSet(last&&last.type==='W'?'N':(last?last.type:'N'))); saveActive(); render(); },
  rmSet:d=>{ act().exercises[+d.e].sets.pop(); saveActive(); render(); },
  noteShow:d=>{ act().exercises[+d.e].showNotes=true; render(); const el=$('#note-'+d.e); el&&el.focus(); },
  goalCycle:d=>{ const e=act().exercises[+d.e]; const i=GOAL_ORDER.indexOf(e.goal); e.goal=GOAL_ORDER[(i+1)%GOAL_ORDER.length]; saveActive(); render(); },
  exMenu:d=>{ S.modal={type:'exmenu',e:+d.e}; renderModal(); },
  exMove:d=>{ const L=act().exercises, i=+d.e, j=i+(+d.d); if(j<0||j>=L.length) return; [L[i],L[j]]=[L[j],L[i]]; S.modal=null; saveActive(); render(); },
  exRemove:d=>{ act().exercises.splice(+d.e,1); S.modal=null; saveActive(); render(); },
  exSwap:d=>{ S.modal={type:'picker',target:{kind:'swap',e:+d.e},q:'',g:'All'}; renderModal(); },
  addExercise:()=>{ S.modal={type:'picker',target:{kind:'active'},q:'',g:'All'}; renderModal(); },
  rtAdd:d=>{ S.modal={type:'picker',target:{kind:'routine',id:d.id},q:'',g:'All'}; renderModal(); },
  pickG:d=>{ S.modal.g=d.g; renderModal(); },
  pick:d=>{
    const t=S.modal.target; S.modal=null;
    if(t.kind==='active'){ const a=act(); const g=a.goal&&a.goal!=='general'?a.goal:'hypertrophy'; a.exercises.push(newEntry(d.id,g,3)); saveActive(); render(); const el=$('#ex-'+(a.exercises.length-1)); el&&el.scrollIntoView({block:'center'}); }
    else if(t.kind==='swap'){ const e=act().exercises[t.e]; e.exId=d.id; e.sets=e.sets.map(s=>blankSet(s.type)); e.sug=suggest(d.id,e.repMin,e.repMax,act().deload); saveActive(); render(); toast('Swapped to '+EXI(d.id).name); }
    else if(t.kind==='routine'){ const r=routineById(t.id); const g=GOALS[r.goal]; r.exercises.push({exId:d.id,sets:3,repMin:g.rep[0],repMax:g.rep[1],rest:restFor(r.goal)}); saveProfile(); render(); }
  },
  finish:()=>{
    const a=act(), done=countDone(a);
    if(!done){ S.modal={type:'confirm',title:'Nothing ticked yet',body:'Tick at least one set to save this workout, or discard it.',ok:a.editingId?'Stop editing':'Discard workout',act:'discardYes',cancel:'Keep going'}; renderModal(); return; }
    const unticked=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>!s.done&&(s.w!=null||s.r!=null)).length,0);
    S.modal={type:'confirm',title:a.editingId?'Save changes?':'Finish workout?',body:`${plural(done,'set')} ticked.`+(unticked?` ${plural(unticked,'filled-in set')} without a tick will be left out.`:'')+' Unticked sets are not saved.',ok:a.editingId?'Save':'Finish',act:'finishYes',cancel:'Keep going'}; renderModal();
  },
  finishYes:()=>{
    const a=act(); if(!a) return;
    const w={id:a.editingId||('w-'+a.startedAt.toString(36)),name:(a.name||'').trim()||'Workout',goal:a.goal||'general',routineId:a.routineId||null,startedAt:a.startedAt,endedAt:a.editingId?(a.endedAt||Date.now()):Date.now(),deload:!!a.deload,

    x[f]=Math.max(f==='sets'?1:1,Math.round(v??x[f])); if(x.repMin>x.repMax){ if(f==='repMin') x.repMax=x.repMin; else x.repMin=x.repMax; } saveProfile(); render(); },

// Phones get the share sheet (Save to Files, Drive, email…); computers get a normal download.
async function saveFile(filename,text,type){
  const blob=new Blob([text],{type});
  try{
    const file=new File([blob],filename,{type});
    if(matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return true; }
  }catch(e){ if(e && e.name==='AbortError') return false; }
  try{
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); toast('Saved '+filename); return true;
  }catch(e){ S.modal={type:'text',title:filename,text}; renderModal(); return false; }
}

/* ================= Example data ================= */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function enterDemo(){
  const rnd=rng(11), prof=defaultProfile(); const d={profile:prof,workouts:{},active:null};
  S.d=d; IDX=null; buildExMap();
  const base={bench:70,row:62.5,ohp:42.5,pullup:0,incdb:24,cablefly:12.5,latraise:9,pushdown:27.5,ohext:22.5,squat:100,rdl:85,legpress:160,latpull:57.5,seatedrow:55,revfly:40,dbcurl:12,hammer:14,legext:50,lyingcurl:37.5,calfraise:70,hlr:0,cablecrunch:40};
  const today=new Date(); today.setHours(0,0,0,0); const w0=addDays(startOfWeek(today),-42);
  prof.program.blockStart=isoDate(w0);
  for(let day=new Date(w0); day<today; day=addDays(day,1)){
    const r=routineById(prof.program.days[dayKey(day)]); if(!r) continue;
    const wn=Math.floor((day-w0)/(7*864e5)), dk=dayKey(day);
    if((wn===2&&dk==='thu')||(wn===4&&dk==='fri')||(wn===5&&dk==='tue')) continue;
    const deload=wn===5; const start=new Date(day); start.setHours(17+Math.floor(rnd()*3),Math.floor(rnd()*50),0,0); let t=start.getTime();
    const exercises=r.exercises.map(x=>{
      const ex=EXI(x.exId); const steps=r.goal==='strength'?Math.min(wn,4):Math.floor(wn/2); const inc=ex.eq==='dumbbell'?2:ex.eq==='bodyweight'?0:2.5;
      const w=(base[x.exId]??20)+steps*inc; const sets=[];
      if(r.goal==='strength' && ex.eq==='barbell'){ sets.push({w:Math.round(w*0.5/2.5)*2.5,r:8,type:'W'},{w:Math.round(w*0.75/2.5)*2.5,r:4,type:'W'}); }
      const n=deload?Math.ceil(x.sets/2):x.sets, span=x.repMax-x.repMin;
      for(let i=0;i<n;i++){
        let reps=r.goal==='strength' ? x.repMax-(wn%2)-(i>=2&&rnd()<0.5?1:0) : x.repMin+((wn*3)%(span+1))-(i>=2&&rnd()<0.6?1:0);
        if(ex.eq==='bodyweight') reps=x.repMin+Math.min(span,wn)-(i>1?1:0);
        sets.push({w:ex.eq==='bodyweight'?0:w,r:Math.max(1,reps),rir:deload?3:r.goal==='strength'?2:(i===n-1?0:1),type:'N'});
      }
      sets.forEach(s=>{ t+=((s.type==='W'?60:x.rest)+35+Math.floor(rnd()*25))*1000; s.done=true; s.at=t; });
      return {exId:x.exId,goal:r.goal,repMin:x.repMin,repMax:x.repMax,rest:x.rest,notes:'',sets};
    });
    const id='w-'+start.getTime().toString(36);
    d.workouts[id]={id,name:r.name,goal:r.goal,routineId:r.id,startedAt:start.getTime(),endedAt:t+90000,deload,exercises,example:true};
  }
  for(let i=0;i<7;i++){ const dd=addDays(w0,i*7); if(dd>today) break; prof.body.push({id:'b-demo'+i,d:isoDate(dd),weight:82.4-i*0.22+(rnd()-0.5)*0.4,waist:87-i*0.3,...(i%3===0?{bodyFat:18.5-i*0.2,arm:38+i*0.05,chest:104,thigh:60}:{})}); }
  prof.goals=[{id:'g-demo1',exId:'bench',metric:'e1rm',target:100},{id:'g-demo2',exId:'squat',metric:'weight',target:140}];
  IDX=null; for(const w of idx().list) w.prs=detectPRs(w);
  S.rest=null; toast('Showing six weeks of example training. Nothing is saved.'); nav('home');
}
